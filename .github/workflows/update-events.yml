name: Update Untappd events

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (UTC); GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Fetch events from public Untappd venue page
        run: python3 scripts/update_untappd.py
      - name: Commit data/events.* if changed
        run: |
          if git diff --quiet -- data/events.json data/events.js; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/events.js
          git commit -m "Update Untappd events snapshot"
          git push
